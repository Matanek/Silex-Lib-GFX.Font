name: Build missing GFX.Font desktop archives

run-name: Build missing GFX.Font desktop archives

on:
  workflow_dispatch:
  push:
    branches:
      - spec-desktop-platform-portability-07
    paths:
      - .github/workflows/build-portability.yml
      - Boundary/SHA256SUMS.txt
      - Native/**

permissions:
  contents: read

concurrency:
  group: gfx-font-build-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [macos-x64, linux-arm64]

    name: ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out GFX.Font
        uses: actions/checkout@v6
        with:
          path: GFX.Font

      - name: Check out FreeType 2.14.3
        uses: actions/checkout@v6
        with:
          repository: freetype/freetype
          ref: 0a0221a1347e2f1e07c395263540026e9a0aa7c7
          path: _freetype

      - name: Check out HarfBuzz 14.2.1
        uses: actions/checkout@v6
        with:
          repository: harfbuzz/harfbuzz
          ref: 56feae4035bdd48f62ba2b8d8c16232d4d89b3a4
          path: _harfbuzz

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL --retry 5 --retry-all-errors https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz -o "$archive"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  $archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-0.16.0" >> "$GITHUB_PATH"

      - name: Verify upstream revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _freetype rev-parse HEAD)" = "0a0221a1347e2f1e07c395263540026e9a0aa7c7"
          test "$(git -C _harfbuzz rev-parse HEAD)" = "56feae4035bdd48f62ba2b8d8c16232d4d89b3a4"

      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          env RUNNER_TEMP="$RUNNER_TEMP/rebuild-a" GFX.Font/Native/build-font-boundary.sh \
            "$GITHUB_WORKSPACE/_freetype" \
            "$GITHUB_WORKSPACE/_harfbuzz" \
            "${{ matrix.target }}"
          mkdir -p "$RUNNER_TEMP/output-a"
          cp GFX.Font/Boundary/${{ matrix.target }}/* "$RUNNER_TEMP/output-a/"
          env RUNNER_TEMP="$RUNNER_TEMP/rebuild-b" GFX.Font/Native/build-font-boundary.sh \
            "$GITHUB_WORKSPACE/_freetype" \
            "$GITHUB_WORKSPACE/_harfbuzz" \
            "${{ matrix.target }}"
          mkdir -p "$RUNNER_TEMP/output-b"
          cp GFX.Font/Boundary/${{ matrix.target }}/* "$RUNNER_TEMP/output-b/"
          for archive in libSilexFont.a libfreetype.a libharfbuzz.a; do
            cmp "$RUNNER_TEMP/output-a/$archive" "$RUNNER_TEMP/output-b/$archive"
            shasum -a 256 "$RUNNER_TEMP/output-a/$archive"
            expected="$(awk -v path="${{ matrix.target }}/$archive" '$2 == path { print $1 }' GFX.Font/Boundary/SHA256SUMS.txt)"
            test -n "$expected"
            echo "$expected  $RUNNER_TEMP/output-a/$archive" | shasum -a 256 -c -
          done

      - name: Preserve candidate archives
        uses: actions/upload-artifact@v4
        with:
          name: gfx-font-${{ matrix.target }}
          path: ${{ runner.temp }}/output-a/*
          retention-days: 7
          if-no-files-found: error
